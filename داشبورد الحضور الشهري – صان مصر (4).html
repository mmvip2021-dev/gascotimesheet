const hm=m=>m>0?Math.floor(m/60)+':'+String(m%60).padStart(2,'0'):'',pm=v=>{v=String(v).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[٫,،]/g,'.').trim();if(v.includes(':')){const[h,m]=v.split(':');return (+h||0)*60+(+m||0)}return Math.round((parseFloat(v)||0)*60)},fr=d=>wd(d)>=5&&wd(d)<=6,ym=()=>S.y+'-'+String(S.m).padStart(2,'0'),nd=()=>new Date(S.y,S.m,0).getDate(),wd=d=>new Date(S.y,S.m-1,d).getDay();

const MZ0={dc:24,nm:170,jb:130,id:50,nt:110,rh:20,hh:56,fs:10,nf:12,sp:3,z:100},MZL=[['dc','عرض خانة اليوم',14,44],['nm','عرض الاسم',100,300],['jb','عرض نوع العمل',60,240],['id','عرض الرقم',30,100],['nt','عرض الملاحظات',50,300],['rh','ارتفاع الصف',18,60],['hh','ارتفاع رأس الأيام',36,100],['fs','حجم الخط',7,18],['nf','حجم خط الاسم',7,20],['sp','صفوف فاضية إضافية',0,20],['z','تكبير الكشف %',50,140]];

const row=(i,e)=>{const r=e?rec(e.id):{a:{},o:{}},cl=k=>fr(k+1)?'f':'',L=Array.from({length:N});
